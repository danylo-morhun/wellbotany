version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore", include: scope }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma 6+ and next-auth majors need a planned migration
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci", include: scope }
    groups:
      actions:
        patterns: ["*"]
