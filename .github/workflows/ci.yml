name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTH_SECRET: "ci-test-auth-secret-32-chars-long-zielarnia"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install
      - run: pnpm exec prisma generate
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit

  # next build statically prerenders pages that query Postgres directly
  # (e.g. src/app/sitemap.ts, /kategoria/[slug]), so both the build and the
  # test suite need a reachable database. Each CI run gets its own ephemeral
  # Neon branch (created from production) so tests never touch shared data.
  provision-db:
    name: Provision Ephemeral Database
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    outputs:
      database_url: ${{ steps.create-branch.outputs.db_url_pooled }}
      direct_url: ${{ steps.create-branch.outputs.db_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - name: Create Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - run: pnpm install
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.create-branch.outputs.db_url }}

  unit-test:
    name: Unit Tests (Vitest)
    needs: provision-db
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ needs.provision-db.outputs.database_url }}
      DIRECT_URL: ${{ needs.provision-db.outputs.direct_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install
      - run: pnpm exec prisma generate
      - run: pnpm exec vitest run tests/unit

  build:
    name: Production Build Verification
    needs: provision-db
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ needs.provision-db.outputs.database_url }}
      DIRECT_URL: ${{ needs.provision-db.outputs.direct_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install
      - run: pnpm exec prisma generate
      - run: pnpm build

  cleanup-db:
    name: Delete Ephemeral Database
    needs: [provision-db, unit-test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
