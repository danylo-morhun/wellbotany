name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTH_SECRET: "ci-test-auth-secret-32-chars-long-wellbotany"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit

  unit-test:
    name: Unit Tests (Vitest)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run tests/unit

  # next build prerenders pages that query Postgres (sitemap, /kategoria/[slug]…),
  # so the build needs a database with the production schema. A throwaway
  # Postgres 18 (same major as prod) is built from the migration history alone
  # (`migrate deploy`, as the Deploy workflow runs it on prod) — a broken
  # migration fails here, not at deploy time — and must then match
  # schema.prisma, so a model change without a migration fails too.
  build:
    name: Production Build Verification
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wellbotany
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/wellbotany
      DIRECT_URL: postgresql://ci:ci@localhost:5432/wellbotany
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the schema from migrations
        run: pnpm exec prisma migrate deploy
      - name: Check schema.prisma matches the migrations
        run: pnpm exec prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm build
