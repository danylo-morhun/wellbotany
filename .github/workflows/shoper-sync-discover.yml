name: Shoper sync (discover new products)

on:
# schedule:
#   - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SHOPER_CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/shoper-sync?mode=discover")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
