name: Deploy

# Production deploy after CI passes on main (or by hand from the Actions tab).
# Migrations run only when prisma/migrations changed since the live deployment,
# and only after approval in the `production-migrations` environment.
# Builds run on Vercel with the project's own env; the job only triggers them.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  SITE_URL: https://wellbotany.pl

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      - name: Diff migrations against the live deployment
        id: diff
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.meta.githubCommitSha // .meta.gitCommitSha // empty')
          echo "Live deployment: ${live:-unknown}"
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "Live commit unknown here — treating migrations as pending"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$live" HEAD -- prisma/migrations; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$live" HEAD -- prisma/migrations
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Migrate production DB
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: ./.github/actions/setup
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy:
    name: Deploy to Vercel
    needs: [plan, migrate]
    if: always() && needs.plan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.SITE_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - name: Remember the live deployment
        id: previous
        run: |
          url=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.url // empty')
          echo "Live before deploy: ${url:-none}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Build and deploy on Vercel
        id: deploy
        run: |
          set -o pipefail
          VERCEL_GUIDANCE_DISABLED=1 npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee "$RUNNER_TEMP/deploy.log"
          # stdout may still carry hints besides the URL — take the last deployment URL
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/deploy.log" | tail -1)
          [ -n "$url" ] || { echo "No deployment URL in vercel output"; exit 1; }
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # After a rollback Vercel stops auto-assigning production domains until a
      # deployment is promoted explicitly (promoting the current one is a 409).
      - name: Promote to production domains
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${SITE_URL#https://}?teamId=$VERCEL_ORG_ID" \
            | jq -r '.url // empty')
          if [ "https://$live" = "$DEPLOY_URL" ]; then
            echo "Domains already on the new deployment"
          else
            echo "Domains on ${live:-none} — promoting"
            npx -y vercel@latest promote "$DEPLOY_URL" --yes --token "$VERCEL_TOKEN"
          fi
      - name: Smoke test
        id: smoke
        run: |
          sleep 10
          curl -fsS -o sitemap.xml "$SITE_URL/sitemap/products.xml"
          product=$(grep -m1 -oE "$SITE_URL/produkt/[^<]+" sitemap.xml)
          fail=0
          for url in "$SITE_URL/" "$SITE_URL/koszyk" "$SITE_URL/zamowienie" "$SITE_URL/logowanie" \
                     "$product" "$SITE_URL/product-feed.xml" "$SITE_URL/sitemap_index.xml" \
                     "$SITE_URL/api/points?service=INPOST_PACZKOMAT&q=Kalisz"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.url != ''
        run: npx -y vercel@latest rollback "${{ steps.previous.outputs.url }}" --yes --token "$VERCEL_TOKEN"
